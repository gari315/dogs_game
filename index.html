<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>しばのぼり</title>
<style>
html,body{margin:0;height:100%;background:#2b2150;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;touch-action:none;display:block}
</style></head><body><canvas id="c" width="360" height="640"></canvas>
<script>
"use strict";
const W=360,VH=640,cv=document.getElementById('c'),g=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/VH);cv.style.width=W*s+'px';cv.style.height=VH*s+'px'}
addEventListener('resize',fit);fit();
// ---- physics constants (fixed timestep => same on every device)
const DW=20,DH=20,SP=100,GR=1600,JV=185,HM=.16,DT=1/60;
// ---- STAGE DATA: add a stage = add one zz({...}) line.
// Islands are generated as a chain that zig-zags across the screen: the dog crosses abysses,
// bounces off a wall (screen edge or a wall pillar) and hops back on the next island.
// n:hops g:gaps r:rises w:widths (cycled)  tr/tl:right/left turn x (<360 / >0 => wall pillar)  s:spikes on turn islands
function zz(o){let x=0,w=90,c=0,d=1,pr=0,pl=0,sp=0;const R=[{x:0,w:90,c:0}],B=[];
 for(let i=0;i<o.n;i++){const g=o.g[i%o.g.length];let nw=o.w[i%o.w.length],nx,e,t=0;c+=o.r[i%o.r.length];
  if(d>0){e=o.tr[pr%o.tr.length];nx=x+w+g;if(nx+nw>e-4){nw=e-nx;if(nw<64){nw=64;nx=e-64}t=1}}
  else{e=o.tl[pl%o.tl.length];nx=x-g-nw;if(nx<e+4){nx=e;nw=x-g-e;if(nw<64)nw=64;t=1}}
  const k=R.push({x:nx,w:nw,c,t})-1;
  if(t){if(d>0){pr++;if(e<W)B.push([k,e])}else{pl++;if(e>0)B.push([k,e-12])}d=-d}
  x=nx;w=nw}
 const H=Math.max(640,c+140),fy=H-50,P=[],Sp=[],Wl=[];
 R.forEach(r=>P.push({x:r.x,y:fy-r.c,w:r.w}));
 B.forEach(([k,wx])=>Wl.push({x:wx,y:fy-R[k].c-44,w:12,h:54}));
 R.forEach(r=>{if(!r.t&&r.c&&o.s&&r.w>=60&&(++sp%4==0))Sp.push({x:Math.round(r.x+(r.w-20)*.6),y:fy-r.c,w:20})});
 const L=R[R.length-1];
 return{H,P,Sp,Wl,start:{x:8,y:fy-DH},goal:{x:L.x+L.w/2-12,y:fy-L.c-30,w:24,h:30}}}
const STAGES=[
 zz({n:18,g:[40,36,44],r:[22,22,24],w:[80,70,90],tr:[360],tl:[0]}),
 zz({n:22,g:[46,40,50,38],r:[24,28,20,26],w:[70,64,80],tr:[360,300],tl:[0,60],s:1}),
 zz({n:24,g:[50,42,54,36],r:[20,32,14,34],w:[62,56,70],tr:[360,290,340],tl:[0,70,20],s:1}),
 zz({n:26,g:[54,44,58,38],r:[18,34,10,34],w:[56,50,62],tr:[360,280],tl:[0,80],s:1}),
 zz({n:28,g:[56,46,60,40],r:[16,34,8,34],w:[48,46,54],tr:[360,270,330],tl:[0,90,30],s:1}),
 zz({n:30,g:[56,48,58,40],r:[14,34,6,34],w:[44,42,50],tr:[360,260,320],tl:[0,100,40],s:1})
];
// ---- save
let sv={u:1,b:{}};try{Object.assign(sv,JSON.parse(localStorage.getItem('shibaNobori')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('shibaNobori',JSON.stringify(sv))}catch(e){}}
const fmt=t=>t.toFixed(2)+'s';
// ---- audio (WebAudio, synthesized: no assets)
let ac,mg,mute=false,nT=0,stp=0;
function initA(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);nT=ac.currentTime+.1;setInterval(sched,50)}catch(e){}}
 if(ac&&ac.state=='suspended')ac.resume()}
function tone(f,t,d,ty,v,f2){if(!ac||mute)return;const o=ac.createOscillator(),a=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(mg);o.start(t);o.stop(t+d+.02)}
const DON=[0,4,8,10,12,13,14],MEL=[523,659,784,659,880,784,659,587,523,587,659,784,659,587,523,0],BASS=[130,0,0,0,196,0,0,0,175,0,0,0,196,0,0,0];
function sched(){if(!ac)return;while(nT<ac.currentTime+.2){const s=stp%16;
 if(DON.includes(s))tone(150,nT,.14,'sine',.55,45);
 if(MEL[s])tone(MEL[s],nT,.2,'triangle',.07);if(BASS[s])tone(BASS[s],nT,.3,'triangle',.12);
 if(s%2)tone(2400,nT,.03,'square',.012);
 nT+=60/116/2;stp++}}
function sfx(k){if(!ac)return;const t=ac.currentTime;
 if(k==1)tone(330,t,.13,'square',.12,700);
 if(k==2)tone(560,t,.09,'triangle',.2,300);
 if(k==3)tone(420,t,.45,'sawtooth',.14,70);
 if(k==4)[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.09,.25,'square',.1))}
// ---- state
let scr='title',sub='run',idx=0,ST,D,T=0,buf=0,held=false,cam=0,dT=0,cT=0,nb=false,parts=[],tm=0;
function start(i){idx=i;ST=STAGES[i];scr='play';reset()}
function reset(){D={x:ST.start.x,y:ST.start.y,vx:SP,vy:0,g:true,co:0,hold:0,jump:false,face:1,turn:0,an:0,rot:0};sub='run';T=0;buf=0;parts=[];cam=camT()}
function camT(){return Math.max(0,Math.min(ST.H-VH,D.y-400))}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+DW>b.x&&a.y<b.y+b.h&&a.y+DH>b.y;
function burst(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*140,vy:-Math.random()*120,l:.4+Math.random()*.3,c})}
function die(){sub='dead';dT=0;D.vx=0;D.vy=-260;sfx(3);burst(D.x+10,D.y+10,14,'#ffd36b')}
function step(){
 parts.forEach(p=>{p.x+=p.vx*DT;p.y+=p.vy*DT;p.vy+=300*DT;p.l-=DT});parts=parts.filter(p=>p.l>0);
 if(sub=='dead'){dT+=DT;D.vy+=GR*DT;D.y+=D.vy*DT;D.rot+=12*DT;if(dT>.8)reset();return}
 if(sub=='clear'){cT+=DT;D.an+=DT;if(cT>2){idx+1<STAGES.length?start(idx+1):(scr='select')}return}
 T+=DT;D.an+=DT;D.turn-=DT;if(buf>0)buf-=DT;
 if(D.g)D.co=.05;else if(D.co>0)D.co-=DT;
 if(buf>0&&D.co>0){D.vy=-JV;D.jump=true;D.hold=0;D.g=false;D.co=0;buf=0;sfx(1)}
 D.x+=D.vx*DT;let b=false;
 for(const w of ST.Wl)if(ov(D,w)){if(D.vx>0)D.x=w.x-DW;else D.x=w.x+w.w;D.vx=-D.vx;b=true}
 if(D.x<0){D.x=0;D.vx=SP;b=true}if(D.x+DW>W){D.x=W-DW;D.vx=-SP;b=true}
 if(b){D.face=D.vx>0?1:-1;D.turn=.2;sfx(2);burst(D.x+(D.face>0?0:DW),D.y+10,6,'#fff')}
 const pb=D.y+DH;D.vy+=GR*DT;
 if(D.jump){if(held&&D.hold<HM){D.vy=-JV;D.hold+=DT}else D.jump=false}
 D.y+=D.vy*DT;D.g=false;
 for(const p of ST.P)if(D.vy>=0&&pb<=p.y+.01&&D.y+DH>=p.y&&D.x+DW>p.x&&D.x<p.x+p.w){D.y=p.y-DH;D.vy=0;D.g=true;D.jump=false}
 for(const w of ST.Wl)if(ov(D,w)){if(D.vy>0&&pb<=w.y+.01){D.y=w.y-DH;D.vy=0;D.g=true;D.jump=false}else{D.y=w.y+w.h;D.vy=Math.max(D.vy,0);D.jump=false}}
 for(const s of ST.Sp)if(D.x+3<s.x+s.w-4&&D.x+DW-3>s.x+4&&D.y+DH-2>s.y-9&&D.y+3<s.y)return die();
 if(D.y>ST.H+30)return die();
 if(ov(D,ST.goal)){sub='clear';cT=0;D.vx=0;nb=false;sfx(4);if(!sv.b[idx]||T<sv.b[idx]){sv.b[idx]=T;nb=true}
  sv.u=Math.max(sv.u,Math.min(STAGES.length,idx+2));save()}
 cam+=(camT()-cam)*.1}
// ---- input
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*VH/r.height]}
function press(px,py){initA();
 if(scr=='title'){if(px>W-50&&py<50){mute=!mute;return}scr='select';return}
 if(scr=='select'){if(px<70&&py<44){scr='title';return}
  for(let i=0;i<STAGES.length;i++){const c=cell(i);if(px>c[0]&&px<c[0]+c[2]&&py>c[1]&&py<c[1]+c[3]&&i<sv.u){start(i);return}}return}
 if(px<64&&py<34){scr='select';return}
 if(sub=='dead'&&dT>.25)reset();
 held=true;buf=.1}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=pt(e);press(p[0],p[1])});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>held=false));
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();if(e.repeat)return;initA();
  if(scr=='title')scr='select';else if(scr=='select')start(Math.min(sv.u,STAGES.length)-1);
  else{if(sub=='dead'&&dT>.25)reset();held=true;buf=.1}}
 else if(e.code=='Escape'){scr=scr=='play'?'select':'title'}else if(e.code=='KeyM')mute=!mute});
addEventListener('keyup',e=>{if(e.code=='Space')held=false});
addEventListener('blur',()=>held=false);
// ---- drawing
const bg=document.createElement('canvas');bg.width=W;bg.height=VH;
(()=>{const b=bg.getContext('2d'),gr=b.createLinearGradient(0,0,0,VH);gr.addColorStop(0,'#8fd0ff');gr.addColorStop(.55,'#d6b9ff');gr.addColorStop(1,'#ffdcee');b.fillStyle=gr;b.fillRect(0,0,W,VH);
 [['#c9e8ff',.74,38,.02],['#a8e6c8',.84,30,.03]].forEach(([c,y,a,f])=>{b.fillStyle=c;b.beginPath();b.moveTo(0,VH);for(let x=0;x<=W;x+=6)b.lineTo(x,VH*y+Math.sin(x*f+y*9)*a);b.lineTo(W,VH);b.fill()})})();
const PAL={o:'#e9903a',w:'#fff0d4',k:'#2b1d1a',n:'#2b1d1a'};
const BODY=["..oo..oo..",".oooooooo.",".okoookoo.",".oowwnwoo.","..oooooo..",".owwwwwwo.","oowwwwwwo.","..oooooo.."];
const LEGS={a:["..oo..oo..",".oo....oo."],b:["...oooo...","...o..o..."],j:[".oo....oo.","oo......oo"],f:["..oo..oo..","..oo..oo.."]};
function dog(x,y,face,leg,sx,sy,rot,al){g.save();g.globalAlpha=al==null?1:al;g.translate(Math.round(x+DW/2),Math.round(y+DH/2));if(rot)g.rotate(rot);g.scale(face*sx,sy);
 BODY.concat(LEGS[leg]).forEach((r,j)=>{for(let i=0;i<10;i++){const c=r[i];if(c!='.'){g.fillStyle=PAL[c];g.fillRect(-10+i*2,-10+j*2,2,2)}}});g.restore()}
function txt(s,x,y,z,c,a){g.font='bold '+z+'px "Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle='rgba(60,30,90,.45)';g.fillText(s,x+1,y+2);g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function sky(){g.drawImage(bg,0,0);for(let i=0;i<26;i++){const x=i*97%W,y=VH-((tm*(8+i%3*6)+i*83)%VH);g.globalAlpha=.4+.4*Math.sin(tm*3+i);g.fillStyle='#fff';g.fillRect(x,y,2,2);if(i%4==0)g.fillRect(x-1,y+.5,4,1)}g.globalAlpha=1}
function pose(){return D.g?(Math.floor(D.an*10)%2?'a':'b'):D.vy<0?'j':'f'}
function world(){
 for(const w of ST.Wl){g.fillStyle='#8f7ac4';g.fillRect(w.x,w.y,w.w,w.h);g.fillStyle='#bba9ea';g.fillRect(w.x,w.y,w.w,3);g.fillRect(w.x,w.y,2,w.h);g.fillStyle='#6d5aa6';g.fillRect(w.x+w.w-2,w.y,2,w.h)}
 for(const p of ST.P){const th=10;g.fillStyle='#8a5f86';g.fillRect(p.x,p.y+4,p.w,th);g.fillStyle='#74e06e';g.fillRect(p.x,p.y,p.w,5);
  g.fillStyle='#a6f59a';for(let i=3;i<p.w;i+=14)g.fillRect(p.x+i,p.y-2,2,3);g.fillStyle='#4fb857';g.fillRect(p.x,p.y+4,p.w,1);g.fillStyle='#6f4a6e';g.fillRect(p.x+4,p.y+14,p.w-8,4);g.fillRect(p.x+10,p.y+18,p.w-20,3)}
 for(const s of ST.Sp){for(let i=0;i<s.w;i+=10){g.fillStyle='#ff5c8a';g.beginPath();g.moveTo(s.x+i,s.y);g.lineTo(s.x+i+5,s.y-12);g.lineTo(s.x+i+10,s.y);g.fill();g.fillStyle='#ffd0e0';g.fillRect(s.x+i+4,s.y-8,2,5)}}
 const o=ST.goal,gl=.5+.3*Math.sin(tm*5);g.fillStyle='#6b4a3a';g.fillRect(o.x+11,o.y,3,o.h);g.fillStyle='rgba(255,230,120,'+gl+')';g.fillRect(o.x+2,o.y-2,22,16);
 g.fillStyle='#ffd23f';g.fillRect(o.x+4,o.y,18,12);g.fillStyle='#fff6b0';g.fillRect(o.x+8,o.y+3,4,4);
 for(const p of parts){g.globalAlpha=Math.min(1,p.l*3);g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),3,3)}g.globalAlpha=1;
 if(sub=='dead')dog(D.x,D.y,D.face,'f',1,1,D.rot,Math.max(0,1-dT/.9));
 else{const t=Math.max(0,D.turn)/.2,sy=1-.2*t,sx=1+.25*t;dog(D.x-(sx-1)*DW/2,D.y+DH*(1-sy)/2,D.face,sub=='clear'?(Math.floor(D.an*6)%2?'j':'a'):pose(),sx,sy,0)}}
function cell(i){return[20+i%2*170,150+(i>>1)*135,150,115]}
function draw(){g.setTransform(1,0,0,1,0,0);sky();
 if(scr=='play'){g.save();g.translate(0,-Math.round(cam));world();g.restore();
  g.fillStyle='rgba(60,30,90,.35)';g.fillRect(0,0,W,30);txt('← STAGE '+(idx+1),10,15,15,'#fff','left');txt(fmt(T),W-10,15,15,'#fff','right');
  if(sub=='clear'){g.fillStyle='rgba(60,30,90,.4)';g.fillRect(0,230,W,150);txt('CLEAR!',W/2,278,48,'#ffe36b');txt(fmt(T),W/2,328,24);if(nb)txt('NEW BEST!',W/2,358,16,'#ff9ad0')}}
 else if(scr=='title'){txt('しばのぼり',W/2,200,48,'#fff');txt('かべで はねて、うえへ',W/2,250,16,'#fff');
  g.fillStyle='#74e06e';g.fillRect(60,420,240,6);g.fillStyle='#8a5f86';g.fillRect(60,426,240,12);
  const x=60+(tm*70%220);dog(x,400,1,Math.floor(tm*10)%2?'a':'b',1,1,0);
  if(Math.sin(tm*4)>-.3)txt('タップ / スペース で はじめる',W/2,520,16);txt(mute?'♪ OFF':'♪ ON',W-12,24,14,'#fff','right')}
 else{txt('← もどる',10,22,15,'#fff','left');txt('ステージ えらぶ',W/2,90,26);
  for(let i=0;i<STAGES.length;i++){const c=cell(i),ok=i<sv.u;g.fillStyle=ok?'rgba(255,255,255,.75)':'rgba(70,50,110,.4)';g.fillRect(c[0],c[1],c[2],c[3]);
   g.fillStyle=ok?'#74e06e':'#6a5a90';g.fillRect(c[0],c[1],c[2],6);
   txt(String(i+1),c[0]+75,c[1]+50,40,ok?'#7a4a9a':'#a89cc8');
   txt(ok?(sv.b[i]!=null?'BEST '+fmt(sv.b[i]):'未クリア'):'ロック',c[0]+75,c[1]+92,14,ok?'#5a3a7a':'#a89cc8')}}}
let last=0,acc=0;
function loop(t){const d=Math.min((t-last)/1000||0,.1);last=t;tm+=d;acc+=d;while(acc>=DT){if(scr=='play')step();acc-=DT}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
